plugins {
    // Plugins automatically generated by MLGradleWriter.kt
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.doom.woof'
    compileSdk 36
    ndkVersion '29.0.14033849'

    defaultConfig {
        applicationId 'com.doom.woof'
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "16.0.1"

        externalNativeBuild {
            cmake {
                // Woof + SDL3 + SDL3_net + OpenAL Soft собираются из исходников в src/main/cpp
                arguments '-DANDROID_STL=c++_static', '-DCMAKE_BUILD_TYPE=Release'
            }
        }
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    buildFeatures {
        viewBinding true
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.31.6'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation libs.androidx.core
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
}
